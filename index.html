<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--text);font-family:var(--sans);line-height:1.6}

.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
.btn{background:var(--clay);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:600 1rem var(--sans);cursor:pointer}
.btn:hover{background:var(--clay2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--mute)}
input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--mute);border-radius:10px;background:var(--canvas);color:var(--text);font:1rem var(--sans);margin:6px 0 14px}
input:focus{outline:2px solid var(--clay);border-color:transparent}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--canvas);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font:.97rem var(--sans);cursor:pointer}
.opt:hover{border-color:var(--clay)}
.opt .dot{flex:none;width:18px;height:18px;margin-top:3px;border:2px solid var(--mute);border-radius:50%}
.opt.chk .dot{border-radius:4px}
.opt.on{border-color:var(--clay);background:color-mix(in srgb,var(--clay) 12%,var(--canvas))}
.opt.on .dot{background:var(--clay);border-color:var(--clay)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--canvas);padding:10px 0 8px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--clay);width:0}
.meta{display:flex;justify-content:space-between;font-size:.88rem;color:var(--sub);margin-bottom:6px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
.small{font-size:.88rem;color:var(--sub)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.res{margin:12px 0}.res .l{display:flex;justify-content:space-between;font-weight:600}
.res .bar{height:12px;margin:4px 0}.res .bar i{background:var(--blue)}.res:first-of-type .bar i{background:var(--clay)}
.tag{display:inline-block;background:var(--line);border-radius:20px;padding:2px 10px;font-size:.82rem;margin:2px 4px 2px 0}
.hide{display:none}
ul{padding-left:20px}
</style>
</head>

['Dalam memandang kehidupan percintaan teman, Anda:',[['Ingin punya yang serupa.',A],['Tidak ingin mengalaminya.','ACE:3'],['Menunggu orang yang tepat.','DEMI:3'],['Tidak tahu.','GRAY:2']]],
['Ketika kuesioner ini bertanya tentang fantasi, Anda merasa:',[['Banyak yang bisa saya ceritakan.',A],['Hampir tidak ada yang bisa diceritakan.','ACE:3'],['Ada, tetapi hanya tentang orang yang dekat.','DEMI:3'],['Berbeda-beda dan tidak jelas.','GRAY:3']]],
['Dalam cara Anda memandang gender pasangan, kalimat yang paling sesuai:',[['Pasangan saya harus lawan jenis.','HET:3'],['Pasangan saya harus sesama jenis.','HOM:3'],['Pasangan saya bisa pria atau wanita.','BI:3'],['Pasangan saya adalah orang yang cocok, apa pun gendernya.','PAN:3']]],
['Dalam hal merasakan rindu, Anda biasanya merindukan:',[['Kekasih atau orang yang saya sukai.',A],['Sahabat yang akrab.','ROMACE:2,ACE:2'],['Orang yang sudah lama dekat.','DEMI:3'],['Hampir tidak merindukan siapa pun.','FRAY:2,ACE:1']]],
['Saat berkunjung ke rumah orang yang Anda sukai, Anda merasa:',[['Berdebar dan bersemangat.',A],['Biasa saja seperti berkunjung ke rumah teman.','ACE:3'],['Nyaman karena sudah dekat.','DEMI:3'],['Tidak yakin dengan perasaan saya.','GRAY:2']]],
['Dalam pendapat Anda, cinta dan hasrat adalah:',[['Dua hal yang berjalan bersama.',A],['Dua hal yang berbeda; saya hanya merasakan cinta.','ROMACE:4,ACE:2'],['Dua hal yang tumbuh bersamaan setelah ikatan terbentuk.','DEMI:4'],['Dua hal yang naik-turun.','FRAY:2,GRAY:2']]],
['Dalam pergaulan, ketika dua orang saling menyukai, Anda:',[['Ikut bahagia dan ingin mengalaminya.',A],['Ikut bahagia saja.','ACE:3'],['Ikut bahagia karena mengenal keduanya.','DEMI:2'],['Biasa saja.','GRAY:2']]],
['Dalam menghadapi gejolak perasaan, cara Anda mengatasinya:',[['Mendekati orang yang saya sukai.',A],['Menikmati waktu sendiri.','ACE:3'],['Menunggu hingga ikatan terbentuk.','DEMI:3'],['Menunggu perasaan itu pergi.','FRAY:3']]],
['Ketika Anda diminta memilih satu gambaran tentang ketertarikan, Anda memilih:',[['Api yang menyala cepat.',A],['Embun yang tenang.','ROMACE:2,ACE:2'],['Benih yang tumbuh pelan.','DEMI:4'],['Ombak yang datang dan pergi.','FRAY:2,GRAY:3']]],
['Pada akhirnya, pertanyaan yang paling ingin Anda jawab tentang diri sendiri:',[['Apakah saya menyukai lawan jenis.','HET:2'],['Apakah saya menyukai sesama jenis.','HOM:2'],['Apakah saya bisa menyukai siapa saja.','BI:2,PAN:2'],['Mengapa ketertarikan saya berbeda dari kebanyakan orang.','ACE:2,DEMI:1,FRAY:1,GRAY:2']]],
['Setelah mengerjakan banyak soal, Anda menyadari bahwa perasaan Anda paling sering:',[['Tertuju pada orang tertentu dengan jelas.',A],['Hampir tidak ada ketertarikan seksual.','ACE:3'],['Muncul setelah ikatan emosional.','DEMI:3'],['Berubah dari waktu ke waktu.','FRAY:2,GRAY:3']]]
);
Q.push(['Jika Anda boleh menutup tes ini dengan satu pernyataan tentang diri Anda, Anda memilih:',[['Saya tertarik pada orang dengan gender tertentu secara jelas.','HET:2,HOM:2'],['Saya tertarik pada orang dari berbagai gender.','BI:2,PAN:3'],['Saya tidak atau jarang merasakan ketertarikan seksual.','ACE:3,GRAY:2'],['Ketertarikan saya muncul dari ikatan atau berubah seiring waktu.','DEMI:3,FRAY:2']]]);
const TOTAL=6000;const STY=['Jawablah dengan jujur. ','Tidak ada jawaban benar atau salah. ','Ikuti insting pertama Anda. ','Pikirkan perasaan Anda yang sebenarnya. ','Luangkan sejenak untuk merenung. ','Jawab sesuai kondisi Anda saat ini. '];const CTX=['Bayangkan Anda sedang berada di sekolah atau kampus. ','Bayangkan Anda sedang bersantai di akhir pekan. ','Bayangkan Anda sedang menonton film atau serial. ','Bayangkan Anda sedang berlibur ke tempat baru. ','Bayangkan Anda sedang berkumpul dengan teman-teman. ','Bayangkan Anda sedang menggunakan media sosial. ','Bayangkan Anda sedang sendirian dan merenung. ','Bayangkan Anda sedang menghadiri acara keluarga. ','Bayangkan Anda sedang mengikuti kegiatan organisasi. ','Bayangkan Anda sedang mengingat masa remaja. ','Bayangkan Anda sedang mengobrol larut malam dengan seseorang. ','Bayangkan Anda sedang berada di tempat baru yang ramai. ','Bayangkan Anda sedang bepergian naik kendaraan umum. ','Bayangkan Anda sedang berada di kegiatan keagamaan atau komunitas. ','Bayangkan Anda sedang mengerjakan tugas kelompok bersama teman. ','Bayangkan Anda sedang membaca buku atau novel. ','Bayangkan Anda sedang mendengarkan musik sendirian. ','Bayangkan Anda sedang berada di pesta atau perayaan. ','Bayangkan Anda sedang berolahraga bersama orang lain. ','Bayangkan Anda sedang berkenalan dengan teman baru secara daring. '];let st={};const $=s=>document.querySelector(s);const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parse(w){const o={};(w||'').split(',').filter(Boolean).forEach(p=>{const[k,v]=p.split(':');o[k]=+v});return o}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

function home(){
app.innerHTML=`<div class="card"><h1>Tes Orientasi Seksual</h1>
<p class="small">Pernahkah Anda bertanya-tanya tentang perasaan atau ketertarikan Anda terhadap orang lain? Orientasi seksual berada pada spektrum yang indah dan kompleks. Tidak ada hasil yang “benar” atau “salah”; jawablah sesuai insting dan perasaan Anda yang sebenarnya.</p>
<label for="nm"><b>Nama lengkap</b> (wajib)</label>
<input id="nm" type="text" maxlength="80" placeholder="Tuliskan nama lengkap Anda" autocomplete="name">
<button class="btn" id="go" disabled>Mulai tes</button></div>`;
const nm=$('#nm'),go=$('#go');nm.oninput=()=>go.disabled=nm.value.trim().length<3;
go.onclick=()=>{st={name:nm.value.trim(),gender:null,s0:[],ans:{},queue:shuffle(Q.map((_,b)=>[b,0])).concat(shuffle(Q.flatMap((_,b)=>CTX.map((_,c)=>[b,c+1])))).slice(0,400),pos:0,n:0,left:TOTAL,start:Date.now(),sel:null,done:false};step0()};}

function topbar(){return `<div class="top"><div class="meta"><span>${esc(st.name)}</span><span>Sisa waktu <span class="timer" id="tm">${fmt(st.left)}</span></span></div></div>`}
function tick(){clearInterval(st.iv);const f=()=>{st.left=Math.max(0,TOTAL-Math.floor((Date.now()-st.start)/1000));const t=$('#tm'),p=$('#pg');if(t)t.textContent=fmt(st.left);if(p)p.style.width=((TOTAL-st.left)/TOTAL*100)+'%';if(st.left<=0){clearInterval(st.iv);finish(true)}};f();st.iv=setInterval(f,500)}

function step0(){
app.innerHTML=topbar()+`<div class="card"><h2>Silakan pilih identitas gender Anda</h2><div id="g"></div>
<h2 style="margin-top:22px">Apakah gagasan tentang hubungan seksual tampak seperti sesuatu yang menarik bagi Anda?</h2><p class="small">Pilih semua yang sesuai.</p><div id="s"></div>
<div class="row"><button class="btn" id="nx" disabled>Berikutnya</button></div></div>`;
const g=$('#g'),s=$('#s');
const dg=()=>{g.innerHTML=GENDERS.map((x,i)=>`<button class="opt ${st.gender===i?'on':''}" data-i="${i}"><span class="dot"></span>${x}</button>`).join('');g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.gender=+b.dataset.i;dg();$('#nx').disabled=false})};
const ds=()=>{s.innerHTML=S0.map((x,i)=>`<button class="opt chk ${st.s0.includes(i)?'on':''}" data-i="${i}"><span class="dot"></span>${x[0]}</button>`).join('');s.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;st.s0=st.s0.includes(i)?st.s0.filter(v=>v!==i):[...st.s0,i];ds()})};
dg();ds();$('#nx').onclick=question;tick()}

function question(){
const L=st.queue.length;if(st.pos>0&&st.pos%L===0)st.queue=shuffle(st.queue);
const pr=st.queue[st.pos%L],bi=pr[0],ci=pr[1],cx=ci?CTX[ci-1]+STY[(bi+ci)%STY.length]:'',qi=bi+'|'+ci,q=Q[bi];st.sel=st.ans[qi]??null;
app.innerHTML=topbar()+`<div class="card"><h2>${cx}${q[0]}</h2><div id="o"></div>
<div class="row"><button class="btn ghost" id="bk"${st.pos?'':' disabled'}>Kembali</button><button class="btn" id="nx">Berikutnya</button><button class="btn ghost" id="sk">Lewati</button><button class="btn ghost" id="fin" style="margin-left:auto">Selesaikan</button></div></div>`;
const o=$('#o');const d=()=>{o.innerHTML=q[1].map((x,i)=>`<button class="opt ${st.sel===i?'on':''}" data-i="${i}"><span class="dot"></span>${x[0]}</button>`).join('');o.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.sel=+b.dataset.i;st.ans[qi]=st.sel;d()})};d();
const next=()=>{if(st.sel!==null)st.ans[qi]=st.sel;st.pos++;question()};
$('#nx').onclick=next;$('#sk').onclick=()=>{st.pos++;question()};
$('#bk').onclick=()=>{if(st.sel!==null)st.ans[qi]=st.sel;st.pos--;question()};
let ask=false;$('#fin').onclick=function(){if(!ask){ask=true;this.textContent='Yakin? Klik lagi untuk selesai';setTimeout(()=>{ask=false;this.textContent='Selesaikan'},4000)}else{if(st.sel!==null)st.ans[qi]=st.sel;finish(false)}};
tick()}

function compute(){const sc={};Object.keys(CAT).forEach(k=>sc[k]=0);
st.s0.forEach(i=>{const w=parse(S0[i][1]);for(const k in w)sc[k]+=w[k]});
for(const qi in st.ans){const w=parse(Q[qi.split('|')[0]][1][st.ans[qi]][1]);for(const k in w)sc[k]+=w[k]}
const tot=Object.values(sc).reduce((a,b)=>a+b,0)||1;
return Object.keys(sc).map(k=>({k,n:CAT[k][0],d:CAT[k][1],v:sc[k],p:Math.round(sc[k]/tot*100)})).sort((a,b)=>b.v-a.v)}

function analysis(r){const t=r.filter(x=>x.v>0);const a=Object.keys(st.ans).length;
if(a<5)return 'Jumlah jawaban masih sedikit sehingga gambaran yang dihasilkan belum cukup stabil. Cobalah menjawab lebih banyak soal untuk hasil yang lebih bermakna.';
const top=t[0],sec=t[1];
let s=`Berdasarkan ${a} soal yang Anda jawab, pola jawaban Anda paling banyak mengarah pada spektrum ${top.n} (${top.p}%)`+(sec&&sec.p>=12?`, disusul ${sec.n} (${sec.p}%).`:'.')+' '+top.d;
const ace=['ACE','GRAY','DEMI','FRAY','ROMACE'];
if(ace.includes(top.k))s+=' Pola ini termasuk dalam spektrum aseksual, yaitu pengalaman ketertarikan seksual yang tidak muncul, jarang muncul, atau bergantung pada kondisi tertentu seperti ikatan emosional. Ini adalah variasi yang normal dan valid.';
else if(t.length>2&&sec&&sec.p>=20)s+=' Kemunculan lebih dari satu pola menunjukkan bahwa ketertarikan Anda bisa bersifat cair atau belum sepenuhnya terdefinisi, dan itu wajar.';
else s+=' Pola jawaban Anda cukup konsisten.';
return s}

function finish(auto){clearInterval(st.iv);st.done=true;st.dur=Math.min(TOTAL,Math.floor((Date.now()-st.start)/1000));st.res=compute();st.txt=analysis(st.res);
const shown=st.res.filter(x=>x.v>0);
app.innerHTML=`<div class="card"><h1>Hasil Analisis Psikologis</h1><p class="small">Peserta: <b>${esc(st.name)}</b> · Identitas gender: ${GENDERS[st.gender]??'-'} · Soal terjawab: ${Object.keys(st.ans).length} · Durasi: ${fmt(st.dur)}${auto?' (waktu habis)':''}</p>
<p>${st.txt}</p>
${shown.map(x=>`<div class="res"><div class="l"><span>${x.n}</span><span>${x.p}%</span></div><div class="bar"><i style="width:${x.p}%"></i></div><div class="small">${x.d}</div></div>`).join('')}
<h3 style="margin-top:20px">Apa itu orientasi seksual?</h3><p class="small">Orientasi seksual merujuk pada pola ketertarikan emosional, romantis, dan seksual seseorang terhadap orang lain. Orientasi berada pada spektrum dan tidak terbatas pada kategori biner. Memahaminya membantu individu mengeksplorasi identitas, mendorong penerimaan diri, dan pengambilan keputusan yang tepat.</p>
<h3>Mengapa ini penting?</h3><ul class="small"><li><b>Temukan diri Anda:</b> pemahaman yang lebih jelas tentang ketertarikan Anda.</li><li><b>Tingkatkan kepercayaan diri:</b> memahami apa yang menarik minat Anda.</li><li><b>Perbaiki hubungan:</b> hubungan yang lebih dalam dan memuaskan.</li><li><b>Dukung kesejahteraan mental:</b> perasaan yang ditekan dapat menyebabkan stres.</li></ul>
<p class="small"><i>Catatan: tes ini bukan alat diagnosis dan hanya panduan refleksi diri. Anda tidak harus menggunakan label apa pun yang terasa tidak tepat. Bila perlu, berbicaralah dengan konselor atau psikolog.</i></p>
<div class="row"><button class="btn" id="pdf">Unduh hasil (PDF)</button><button class="btn ghost" id="again">Ulangi tes</button></div><p class="small" id="msg"></p></div>`;
$('#pdf').onclick=savePdf;$('#again').onclick=home}

async function savePdf(){
const msg=$('#msg');try{
const {jsPDF}=window.jspdf;const d=new jsPDF({unit:'mm',format:'a4'});let y=20;const W=210,M=18;
const chk=h=>{if(y+h>280){d.addPage();y=20}};
const tx=(t,sz,b,c)=>{d.setFont('times',b?'bold':'normal');d.setFontSize(sz);if(c)d.setTextColor(...c);else d.setTextColor(20,20,19);d.splitTextToSize(t,W-2*M).forEach(l=>{chk(sz*.5);d.text(l,M,y);y+=sz*.5});y+=2};
d.setFillColor(217,119,87);d.rect(0,0,W,12,'F');y=24;
tx('Hasil Analisis Tes Orientasi Seksual',20,true);
tx('Nama peserta: '+st.name,13,true);
tx('Tanggal: '+new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})+'   |   Identitas gender: '+(GENDERS[st.gender]??'-'),11,false,[90,87,80]);
tx('Soal terjawab: '+Object.keys(st.ans).length+'   |   Durasi pengerjaan: '+fmt(st.dur)+' dari 100:00 menit',11,false,[90,87,80]);y+=4;
tx('Ringkasan Analisis',15,true);tx(st.txt,11);y+=3;
tx('Profil Kecenderungan',15,true);
st.res.filter(x=>x.v>0).forEach(x=>{chk(18);tx(x.n+' - '+x.p+'%',12,true);d.setFillColor(232,230,220);d.rect(M,y-1,W-2*M,3.5,'F');d.setFillColor(217,119,87);d.rect(M,y-1,(W-2*M)*x.p/100,3.5,'F');y+=6;tx(x.d,10,false,[90,87,80])});y+=3;
tx('Apa itu orientasi seksual?',15,true);
tx('Orientasi seksual merujuk pada pola ketertarikan emosional, romantis, dan seksual seseorang terhadap orang lain. Orientasi berada pada spektrum dan tidak terbatas pada kategori biner. Memahaminya membantu individu mengeksplorasi identitas, mendorong penerimaan diri, dan pengambilan keputusan yang tepat.',11);
tx('Catatan: tes ini bukan alat diagnosis, hanya panduan refleksi diri. Perasaan Anda valid terlepas dari hasil tes. Bila perlu, konsultasikan dengan konselor atau psikolog profesional.',10,false,[90,87,80]);
const blob=d.output('blob');const fn='Hasil-Tes-Orientasi-'+st.name.replace(/[^\w\-]+/g,'_')+'.pdf';
const dl=window.claude?await claude.use('downloads'):null;
if(dl){await dl.save({filename:fn,data:blob});msg.textContent='PDF siap disimpan.'}
else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click();msg.textContent='PDF diunduh.'}
}catch(e){msg.textContent=(e&&e.code==='declined')?'Penyimpanan dibatalkan.':'PDF gagal dibuat: '+(e.message||e)}}
home();
</script>
